<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#2563eb"
  >

  <meta
    name="description"
    content="SAMEEJA MOBILE POS - Fast and secure access to your business POS system."
  >

  <title>SAMEEJA MOBILE POS</title>

  <link
    rel="manifest"
    href="./manifest.json"
  >

  <link
    rel="icon"
    type="image/png"
    sizes="192x192"
    href="./icon-192.png"
  >

  <link
    rel="apple-touch-icon"
    href="./icon-192.png"
  >


  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      font-family:
        Arial,
        Helvetica,
        sans-serif;
    }

    body {
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 24px;

      color: #172033;

      background:
        radial-gradient(
          circle at top left,
          #dbeafe 0%,
          transparent 38%
        ),
        radial-gradient(
          circle at bottom right,
          #eff6ff 0%,
          transparent 40%
        ),
        #f8fafc;
    }

    .app-card {
      width: min(
        430px,
        100%
      );

      padding:
        32px 26px 28px;

      text-align: center;

      background:
        rgba(
          255,
          255,
          255,
          0.96
        );

      border:
        1px solid #dbeafe;

      border-radius:
        28px;

      box-shadow:
        0 25px 70px
        rgba(
          30,
          64,
          175,
          0.14
        );
    }

    .brand-logo {
      width: 94px;
      height: 94px;

      margin:
        0 auto 18px;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;

      border-radius: 25px;

      background:
        linear-gradient(
          145deg,
          #1e40af,
          #2563eb 58%,
          #38bdf8
        );

      box-shadow:
        0 16px 35px
        rgba(
          37,
          99,
          235,
          0.28
        );
    }

    .brand-logo svg {
      width: 78px;
      height: 78px;
    }

    .shop-label {
      margin-bottom: 7px;

      color: #2563eb;

      font-size: 11px;
      font-weight: 800;

      letter-spacing: 1.6px;

      text-transform: uppercase;
    }

    h1 {
      margin:
        0 0 8px;

      color: #172554;

      font-size: 27px;
      line-height: 1.18;

      font-weight: 900;
    }

    .subtitle {
      margin:
        0 auto;

      max-width: 330px;

      color: #64748b;

      font-size: 13px;
      line-height: 1.65;
    }

    .badges {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;

      gap: 8px;

      margin:
        22px 0 26px;
    }

    .badge {
      padding:
        7px 10px;

      border:
        1px solid #dbeafe;

      border-radius:
        999px;

      color: #1d4ed8;

      background: #eff6ff;

      font-size: 10px;
      font-weight: 800;
    }

    .action-button {
      width: 100%;

      min-height: 50px;

      display: flex;
      align-items: center;
      justify-content: center;

      gap: 8px;

      padding:
        13px 18px;

      border-radius:
        14px;

      font-family: inherit;
      font-size: 13px;
      font-weight: 900;

      cursor: pointer;

      transition:
        transform 0.16s ease,
        box-shadow 0.16s ease;
    }

    .action-button:hover {
      transform:
        translateY(-1px);
    }

    #installButton {
      display: none;

      margin-bottom: 11px;

      border: 0;

      color: #ffffff;

      background:
        linear-gradient(
          135deg,
          #2563eb,
          #1d4ed8
        );

      box-shadow:
        0 12px 25px
        rgba(
          37,
          99,
          235,
          0.25
        );
    }

    #openButton {
      border:
        1px solid #93c5fd;

      color: #1d4ed8;

      background:
        #eff6ff;
    }

    .footer {
      margin-top: 19px;

      color: #94a3b8;

      font-size: 10px;
    }

    .install-note {
      display: none;

      margin:
        12px 0 0;

      padding:
        10px 12px;

      border-radius:
        11px;

      color: #475569;

      background: #f8fafc;

      font-size: 10px;
      line-height: 1.5;
    }


    @media (
      max-width: 520px
    ) {

      body {
        padding: 16px;
      }

      .app-card {
        padding:
          27px 20px 24px;

        border-radius: 23px;
      }

      .brand-logo {
        width: 84px;
        height: 84px;
      }

      .brand-logo svg {
        width: 70px;
        height: 70px;
      }

      h1 {
        font-size: 24px;
      }

    }
  </style>
</head>


<body>

  <main class="app-card">

    <div class="brand-logo">

      <svg
        viewBox="0 0 100 100"
        xmlns="http://www.w3.org/2000/svg"
        aria-hidden="true"
      >

        <rect
          x="28"
          y="10"
          width="44"
          height="78"
          rx="10"
          fill="#ffffff"
        />

        <rect
          x="34"
          y="19"
          width="32"
          height="52"
          rx="5"
          fill="#dbeafe"
        />

        <circle
          cx="50"
          cy="79"
          r="4"
          fill="#2563eb"
        />

        <path
          d="
            M73 25
            C58 18 35 24 33 39
            C31 51 45 54 55 57
            C65 60 70 64 66 72
            C62 80 44 81 29 72
          "
          fill="none"
          stroke="#2563eb"
          stroke-width="10"
          stroke-linecap="round"
        />

        <path
          d="
            M72 27
            C59 25 45 28 43 38
          "
          fill="none"
          stroke="#38bdf8"
          stroke-width="4"
          stroke-linecap="round"
        />

      </svg>

    </div>


    <div class="shop-label">
      Business POS Application
    </div>


    <h1>
      SAMEEJA MOBILE
    </h1>


    <p class="subtitle">
      Fast and secure access to your SAMEEJA MOBILE
      business POS system.
    </p>


    <div class="badges">

      <span class="badge">
        ✓ Secure
      </span>

      <span class="badge">
        ⚡ Quick Access
      </span>

      <span class="badge">
        📱 Mobile Ready
      </span>

    </div>


    <button
      id="installButton"
      class="action-button"
      type="button"
    >
      ＋ Install SAMEEJA MOBILE
    </button>


    <button
      id="openButton"
      class="action-button"
      type="button"
    >
      Open POS →
    </button>


    <div
      id="installNote"
      class="install-note"
    >
      Open your browser menu and choose
      <strong>Install App</strong> or
      <strong>Add to Home Screen</strong>.
    </div>


    <div class="footer">
      SAMEEJA MOBILE • Smart Retail POS
    </div>

  </main>


  <script>
    /*
     * SAMEEJA MOBILE POS URL
     */
    const POS_URL =
      'https://script.google.com/macros/s/AKfycbwrjsreHxw6NfrcggizgdU_nwvvZtc9LrfNeAHCI66uu0UWCg2f3P9H6Hpp_ANa9SWEGA/exec';


    const installButton =
      document.getElementById(
        'installButton'
      );

    const openButton =
      document.getElementById(
        'openButton'
      );

    const installNote =
      document.getElementById(
        'installNote'
      );


    let deferredPrompt =
      null;


    /*
     * Check if launcher is already installed.
     */
    function isInstalled() {

      return (
        (
          window.matchMedia &&
          window.matchMedia(
            '(display-mode: standalone)'
          ).matches
        ) ||
        window.navigator.standalone ===
          true
      );

    }


    /*
     * Open actual SAMEEJA POS.
     */
    function openPOS() {

      window.location.href =
        POS_URL;

    }


    /*
     * Capture browser install event.
     */
    window.addEventListener(
      'beforeinstallprompt',
      function(event) {

        event.preventDefault();

        deferredPrompt =
          event;

        installButton.style.display =
          'flex';

      }
    );


    /*
     * Install button.
     */
    installButton.addEventListener(
      'click',
      async function() {

        if (
          deferredPrompt
        ) {

          deferredPrompt.prompt();


          const result =
            await deferredPrompt.userChoice;


          deferredPrompt =
            null;


          if (
            result &&
            result.outcome ===
              'accepted'
          ) {

            installButton.style.display =
              'none';

          }


          return;

        }


        installNote.style.display =
          'block';

      }
    );


    /*
     * Open POS button.
     */
    openButton.addEventListener(
      'click',
      openPOS
    );


    /*
     * Installation complete.
     */
    window.addEventListener(
      'appinstalled',
      function() {

        installButton.style.display =
          'none';

        installNote.style.display =
          'none';

      }
    );


    /*
     * Service Worker
     */
    if (
      'serviceWorker' in navigator
    ) {

      window.addEventListener(
        'load',
        function() {

          navigator.serviceWorker
            .register(
              './sw.js'
            )
            .catch(
              function(error) {

                console.log(
                  'Service worker error:',
                  error
                );

              }
            );

        }
      );

    }


    /*
     * Installed launcher:
     * automatically open actual SAMEEJA POS.
     */
    if (
      isInstalled()
    ) {

      setTimeout(
        openPOS,
        700
      );

    }

  </script>

</body>
</html>
